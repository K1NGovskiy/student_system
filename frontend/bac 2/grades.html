<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ведомость</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-university me-2"></i>Деканат
            </a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="students.html"><i class="fas fa-users me-1"></i>Студенты</a></li>
                <li class="nav-item"><a class="nav-link" href="courses.html"><i class="fas fa-book me-1"></i>Курсы</a></li>
                <li class="nav-item"><a class="nav-link" href="grades.html"><i class="fas fa-clipboard-list me-1"></i>Ведомость</a></li>
                <li class="nav-item"><a class="nav-link" href="summary.html"><i class="fas fa-chart-line me-1"></i>Итоговая успеваемость</a></li>
                <li class="nav-item"><a class="nav-link" href="average.html"><i class="fas fa-calculator me-1"></i>Средний балл</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-warning text-dark">
                <h1 class="card-title mb-0">
                    <i class="fas fa-clipboard-list me-2"></i>Ведомость
                </h1>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <label for="courseFilter" class="form-label fw-bold">Фильтр по названию курса (частичное совпадение):</label>
                    <input type="text" id="courseFilter" class="form-control mb-2" placeholder="Введите название курса (например, ТСВ)">
                    
                    <label for="studentFilter" class="form-label fw-bold">Фильтр по ФИО студента (частичное совпадение):</label>
                    <input type="text" id="studentFilter" class="form-control mb-2" placeholder="Введите ФИО (например, Грошев)">
                    
                    <div class="d-flex gap-2">
                        <button onclick="loadData('/grades/')" class="btn btn-warning">
                            <i class="fas fa-search me-1"></i>Фильтровать
                        </button>
                        <button onclick="clearFilter()" class="btn btn-outline-secondary">
                            <i class="fas fa-times me-1"></i>Очистить
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th><i class="fas fa-id-card me-1"></i>ID</th>
                                <th><i class="fas fa-user me-1"></i>Студент</th>
                                <th><i class="fas fa-book me-1"></i>Курс</th>
                                <th><i class="fas fa-star me-1"></i>Оценка</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white mt-5 py-3">
        <div class="container text-center">
             <p class="mb-0">2025 Курсовая работа. Система учёта успеваемости.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        function clearFilter() {
            document.getElementById('courseFilter').value = '';
            document.getElementById('studentFilter').value = '';
            loadData('/grades/');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            loadData('/grades/');
        });
        
        document.getElementById('courseFilter').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadData('/grades/');
            }
        });
        
        document.getElementById('studentFilter').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadData('/grades/');
            }
        });
    </script>
</body>
</html>
