
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Студенты</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Деканат</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="students.html">Студенты</a></li>
                <li class="nav-item"><a class="nav-link" href="courses.html">Курсы</a></li>
                <li class="nav-item"><a class="nav-link" href="grades.html">Ведомость</a></li>
                <li class="nav-item"><a class="nav-link" href="summary.html">Итоговая успеваемость</a></li>
                <li class="nav-item"><a class="nav-link" href="average.html">Средний балл</a></li>
            </ul>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Список студентов</h1>
        <div class="mb-3">
            <label for="groupFilter" class="form-label">Фильтр по названию группы (частичное совпадение):</label>
            <input type="text" id="groupFilter" class="form-control mb-2" placeholder="Введите название группы (например, М7О-507С-21)">
            <button onclick="loadData('/students/')" class="btn btn-primary">Фильтровать</button>
            <button onclick="clearFilter()" class="btn btn-secondary">Очистить</button>
        </div>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО</th>
                    <th>Группа</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
    <script>
        // Функция для очистки фильтра
        function clearFilter() {
            document.getElementById('groupFilter').value = '';
            loadData('/students/');
        }
        
        // Загрузка данных при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadData('/students/');
        });
        
        // Обработка нажатия Enter в поле фильтра
        document.getElementById('groupFilter').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadData('/students/');
            }
        });
    </script>
</body>
</html>
